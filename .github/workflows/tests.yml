name: tests

on:
  push:
  pull_request:

jobs:
  engine:
    name: engine + awkward videos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # the Windows build ships 3.11, so test on 3.11
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - name: Every module compiles
        run: python -m compileall -q app tests tools
      - name: Make the test videos
        run: python tests/make_fixtures.py
      - name: Engine and helper tests
        run: python tests/run_tests.py quick
      - name: Every new feature on awkward videos
        run: python tests/run_tests.py odd

  gui:
    name: windows (Tk, virtual display)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ffmpeg, a virtual display and Tk
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb imagemagick tk
      - run: pip install -r requirements-dev.txt
      - name: Tk is available
        run: python -c "import tkinter; tkinter.Tcl().eval('info patchlevel')"
      - run: python tests/make_fixtures.py stream
      - name: GUI tests
        run: xvfb-run -a -s "-screen 0 1400x900x24" python tests/run_tests.py gui
